services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: profile_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-profile_db}
    ports:
      # Expose PostgreSQL to host port 5433 (mapped to container 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-profile_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - profile_network

  # -------------------------------------------------------------
  # Redis In-Memory Cache Service
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: profile_redis
    restart: always
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
      '
    ports:
      # Expose Redis to host port 6380 (mapped to container 6379)
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "${REDIS_PASSWORD}" ]; then
            redis-cli -a "${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
        '
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - profile_network

  # -------------------------------------------------------------
  # MinIO Self-Hosted S3 Object Storage Service
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: profile_minio
    restart: always
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
    ports:
      # S3 API endpoint (mapped from host port 9005 -> container port 9000)
      - "9005:9000"
      # MinIO Web Console Dashboard (mapped from host port 9006 -> container port 9001)
      - "9006:9001"
    volumes:
      - minio_data:/data
    networks:
      - profile_network

  # -------------------------------------------------------------
  # Next.js Application Service
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profile_web_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Expose Next.js Web App to host port 5000
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Internal Docker Database Connection URL
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-profile_db}?schema=public
      DATABASE_SSL: "false"

      # Redis Cache Configuration
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}

      # Authentication & JWT
      ADMIN_EMAIL: ${ADMIN_EMAIL:-arkan@gmail.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$2a$12$/iw.MaxCyIw2KzCIDwkywO/UJgB7.q6C1vhI/RIyX9qaQrgopMH6u}
      JWT_SECRET: ${JWT_SECRET:-rahasia}

      # Cloudinary Storage (Fallback)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dvpb6z2oj}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-795639345722721}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-XhEZ7PRv0xlESqgBqCkl8R5Edt4}

      # MinIO Self-Hosted S3 Storage Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secure_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-portfolio}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # Email Configuration (Nodemailer)
      EMAIL_USER: ${EMAIL_USER:-muhammadarkanmariadi@gmail.com}
      EMAIL_PASS: ${EMAIL_PASS:-ebau sviz sicc ljns}

      # GitHub Sync Automation
      GITHUB_USERNAME: ${GITHUB_USERNAME:-muhammadarkanmariadi-debug}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-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}
      CRON_SECRET: ${CRON_SECRET:-4rk4njay}
      SKIP_FORKS: ${SKIP_FORKS:-false}
      SKIP_ARCHIVED: ${SKIP_ARCHIVED:-false}
      OVERWRITE_DESCRIPTION_ON_SYNC: ${OVERWRITE_DESCRIPTION_ON_SYNC:-false}
      SYNC_INTERVAL_CRON: ${SYNC_INTERVAL_CRON:-false}

    networks:
      - profile_network

# -------------------------------------------------------------
# Named Volumes for Persistent Storage
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# -------------------------------------------------------------
# Bridge Network for Container Isolation
# -------------------------------------------------------------
networks:
  profile_network:
    driver: bridge
