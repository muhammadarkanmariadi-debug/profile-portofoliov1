services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: profile_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-profile_db}
    ports:
      # Exposing port 5432 is optional; comment out if you only want internal access
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-profile_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - profile_network

  # -------------------------------------------------------------
  # Next.js Application Service
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profile_web_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Internal Docker Database Connection URL
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-profile_db}?schema=public
      DATABASE_SSL: "false"

      # Authentication & JWT
      ADMIN_EMAIL: ${ADMIN_EMAIL:-arkan@gmail.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$2a$12$/iw.MaxCyIw2KzCIDwkywO/UJgB7.q6C1vhI/RIyX9qaQrgopMH6u}
      JWT_SECRET: ${JWT_SECRET:-rahasia}

      # Cloudinary Storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dvpb6z2oj}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-795639345722721}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-XhEZ7PRv0xlESqgBqCkl8R5Edt4}

      # Email Configuration (Nodemailer)
      EMAIL_USER: ${EMAIL_USER:-muhammadarkanmariadi@gmail.com}
      EMAIL_PASS: ${EMAIL_PASS:-ebau sviz sicc ljns}

      # GitHub Sync Automation
      GITHUB_USERNAME: ${GITHUB_USERNAME:-muhammadarkanmariadi-debug}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-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}
      CRON_SECRET: ${CRON_SECRET:-4rk4njay}
      SKIP_FORKS: ${SKIP_FORKS:-false}
      SKIP_ARCHIVED: ${SKIP_ARCHIVED:-false}
      OVERWRITE_DESCRIPTION_ON_SYNC: ${OVERWRITE_DESCRIPTION_ON_SYNC:-false}
      SYNC_INTERVAL_CRON: ${SYNC_INTERVAL_CRON:-false}

    networks:
      - profile_network

# -------------------------------------------------------------
# Named Volumes for Persistent Storage
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# -------------------------------------------------------------
# Bridge Network for Container Isolation
# -------------------------------------------------------------
networks:
  profile_network:
    driver: bridge
